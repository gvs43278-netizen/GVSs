name: Build Business-Manager-Pro Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMGR" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
            mkdir -p "$SDK_DIR/cmdline-tools"
            unzip -q /tmp/cmdline.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK (assembleDebug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Business-Manager-Pro.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Business-Manager-Pro.apk

      - name: Upload Business-Manager-Pro.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Business-Manager-Pro
          path: Business-Manager-Pro.apk
          retention-days: 30
